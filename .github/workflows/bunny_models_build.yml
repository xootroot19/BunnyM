                          fontWeight:
                              FontWeight.w900,
                          letterSpacing: 1.3,
                        ),
                      ),
                      const SizedBox(
                        height: 4,
                      ),
                      const Text(
                        'Adicionar gasto',
                        style: TextStyle(
                          color:
                              BunnyColors.text,
                          fontSize: 23,
                          fontWeight:
                              FontWeight.w900,
                        ),
                      ),
                      const SizedBox(
                        height: 20,
                      ),
                      Wrap(
                        spacing: 7,
                        runSpacing: 7,
                        children:
                            types.map(
                          (item) {
                            final selected =
                                type ==
                                    item;

                            return ChoiceChip(
                              selected:
                                  selected,
                              showCheckmark:
                                  false,
                              label: Text(
                                item,
                              ),
                              labelStyle:
                                  TextStyle(
                                fontSize: 9,
                                fontWeight:
                                    selected
                                        ? FontWeight
                                            .w900
                                        : FontWeight
                                            .w700,
                                color: selected
                                    ? BunnyColors
                                        .pink
                                    : BunnyColors
                                        .muted,
                              ),
                              backgroundColor:
                                  Colors.white,
                              selectedColor:
                                  BunnyColors
                                      .pinkSoft,
                              side:
                                  BorderSide(
                                color: selected
                                    ? BunnyColors
                                        .pink
                                    : BunnyColors
                                        .border,
                              ),
                              onSelected:
                                  (_) {
                                setState(
                                    () {
                                  type =
                                      item;
                                });
                              },
                            );
                          },
                        ).toList(),
                      ),
                      const SizedBox(
                        height: 18,
                      ),
                      BunnyInput(
                        controller:
                            value,
                        icon: Icons
                            .payments_outlined,
                        hint: 'Valor',
                        keyboard:
                            const TextInputType
                                .numberWithOptions(
                          decimal: true,
                        ),
                      ),
                      const SizedBox(
                        height: 12,
                      ),
                      PinkButton(
                        text:
                            'Adicionar despesa',
                        icon:
                            Icons.add_rounded,
                        onPressed: () {
                          final number =
                              parseMoney(
                            value.text,
                          );

                          if (number <= 0) {
                            return;
                          }

                          Navigator.pop(
                            context,
                            Expense(
                              id: DateTime
                                  .now()
                                  .microsecondsSinceEpoch
                                  .toString(),
                              type: type,
                              value:
                                  number,
                            ),
                          );
                        },
                      ),
                    ],
                  ),
                ),
              );
            }
          }

