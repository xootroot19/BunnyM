name: Build Bunny Models Flutter

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Create Flutter app
        run: |
          rm -rf bunny_models
          flutter create --platforms=android bunny_models
          cd bunny_models

          rm -f test/widget_test.dart

          cat > pubspec.yaml <<'EOF'
          name: bunny_models
          description: Bunny Models management app
          publish_to: "none"
          version: 2.0.0+2

          environment:
            sdk: ">=3.3.0 <4.0.0"

          dependencies:
            flutter:
              sdk: flutter
            shared_preferences: ^2.5.3

          dev_dependencies:
            flutter_test:
              sdk: flutter
            flutter_lints: ^5.0.0

          flutter:
            uses-material-design: true
          EOF

          cat > lib/main.dart <<'EOF'
          import 'dart:convert';
          import 'package:flutter/material.dart';
          import 'package:flutter/services.dart';
          import 'package:shared_preferences/shared_preferences.dart';

          void main() {
            WidgetsFlutterBinding.ensureInitialized();

            SystemChrome.setSystemUIOverlayStyle(
              const SystemUiOverlayStyle(
                statusBarColor: BunnyColors.pink,
                statusBarIconBrightness: Brightness.light,
                systemNavigationBarColor: Colors.white,
                systemNavigationBarIconBrightness: Brightness.dark,
              ),
            );

            runApp(const BunnyModelsApp());
          }

          class BunnyColors {
            static const pink = Color(0xFFF21872);
            static const pinkDark = Color(0xFFD90E61);
            static const pinkLight = Color(0xFFFF4A90);

            static const pinkSoft = Color(0xFFFCE4EE);
            static const pinkSofter = Color(0xFFFFF2F7);
            static const blush = Color(0xFFF8D4E1);

            static const background = Color(0xFFFFF9FB);
            static const white = Colors.white;

            static const text = Color(0xFF191416);
            static const muted = Color(0xFF81777B);
            static const faint = Color(0xFFAAA0A4);
            static const border = Color(0xFFF0E5E9);

            static const green = Color(0xFF2E835B);
            static const greenSoft = Color(0xFFE9F5EF);

            static const red = Color(0xFFC84B61);
            static const redSoft = Color(0xFFFDECEF);
          }

          class BunnyModelsApp extends StatefulWidget {
            const BunnyModelsApp({super.key});

            @override
            State<BunnyModelsApp> createState() => _BunnyModelsAppState();
          }

          class _BunnyModelsAppState extends State<BunnyModelsApp> {
            bool loading = true;
            bool loggedIn = false;
            List<Job> jobs = [];

            @override
            void initState() {
              super.initState();
              load();
            }

            Future<void> load() async {
              final prefs = await SharedPreferences.getInstance();

              final savedLogin =
                  prefs.getBool('bunny_logged_in') ?? false;

              final savedJobs =
                  prefs.getString('bunny_jobs');

              final loaded = <Job>[];

              if (savedJobs != null && savedJobs.isNotEmpty) {
                try {
                  final data =
                      jsonDecode(savedJobs) as List<dynamic>;

                  for (final item in data) {
                    loaded.add(
                      Job.fromJson(
                        Map<String, dynamic>.from(item),
                      ),
                    );
                  }
                } catch (_) {}
              }

              if (!mounted) return;

              setState(() {
                loggedIn = savedLogin;
                jobs = loaded;
                loading = false;
              });
            }

            Future<void> saveJobs(List<Job> newJobs) async {
              final prefs = await SharedPreferences.getInstance();

              await prefs.setString(
                'bunny_jobs',
                jsonEncode(
                  newJobs.map((e) => e.toJson()).toList(),
                ),
              );
            }

            Future<void> login() async {
              final prefs = await SharedPreferences.getInstance();

              await prefs.setBool(
                'bunny_logged_in',
                true,
              );

              setState(() {
                loggedIn = true;
              });
            }

            Future<void> logout() async {
              final prefs = await SharedPreferences.getInstance();

              await prefs.setBool(
                'bunny_logged_in',
                false,
              );

              setState(() {
                loggedIn = false;
              });
            }

            void addJob(Job job) {
              final updated = [
                job,
                ...jobs,
              ];

              setState(() {
                jobs = updated;
              });

              saveJobs(updated);
            }

            void updateJob(Job job) {
              final updated = jobs
                  .map(
                    (item) =>
                        item.id == job.id ? job : item,
                  )
                  .toList();

              setState(() {
                jobs = updated;
              });

              saveJobs(updated);
            }

            void deleteJob(String id) {
              final updated = jobs
                  .where(
                    (item) => item.id != id,
                  )
                  .toList();

              setState(() {
                jobs = updated;
              });

              saveJobs(updated);
            }

            @override
            Widget build(BuildContext context) {
              return MaterialApp(
                debugShowCheckedModeBanner: false,
                title: 'Bunny Models',
                theme: ThemeData(
                  useMaterial3: true,
                  scaffoldBackgroundColor:
                      BunnyColors.background,
                  fontFamily: 'Roboto',
                  colorScheme: ColorScheme.fromSeed(
                    seedColor: BunnyColors.pink,
                    primary: BunnyColors.pink,
                    surface: BunnyColors.white,
                  ),
                  inputDecorationTheme:
                      const InputDecorationTheme(
                    border: InputBorder.none,
                  ),
                ),
                home: loading
                    ? const SplashPage()
                    : AnimatedSwitcher(
                        duration:
                            const Duration(milliseconds: 450),
                        child: loggedIn
                            ? MainShell(
                                key: const ValueKey(
                                  'shell',
                                ),
                                jobs: jobs,
                                onAddJob: addJob,
                                onUpdateJob:
                                    updateJob,
                                onDeleteJob:
                                    deleteJob,
                                onLogout: logout,
                              )
                            : LoginPage(
                                key: const ValueKey(
                                  'login',
                                ),
                                onLogin: login,
                              ),
                      ),
              );
            }
          }

          class SplashPage extends StatefulWidget {
            const SplashPage({super.key});

            @override
            State<SplashPage> createState() =>
                _SplashPageState();
          }

          class _SplashPageState
              extends State<SplashPage>
              with SingleTickerProviderStateMixin {
            late final AnimationController controller;
            late final Animation<double> scale;

            @override
            void initState() {
              super.initState();

              controller = AnimationController(
                vsync: this,
                duration:
                    const Duration(milliseconds: 900),
              );

              scale = CurvedAnimation(
                parent: controller,
                curve: Curves.elasticOut,
              );

              controller.forward();
            }

            @override
            void dispose() {
              controller.dispose();
              super.dispose();
            }

            @override
            Widget build(BuildContext context) {
              return Scaffold(
                backgroundColor: BunnyColors.pink,
                body: Center(
                  child: ScaleTransition(
                    scale: scale,
                    child: const Column(
                      mainAxisSize: MainAxisSize.min,
                      children: [
                        BunnyLogo(
                          size: 100,
                          white: true,
                        ),
                        SizedBox(height: 20),
                        Text(
                          'bunnymodels',
                          style: TextStyle(
                            color: Colors.white,
                            fontSize: 31,
                            fontWeight: FontWeight.w900,
                            letterSpacing: -1.5,
                          ),
                        ),
                      ],
                    ),
                  ),
                ),
              );
            }
          }

          class LoginPage extends StatefulWidget {
            const LoginPage({
              super.key,
