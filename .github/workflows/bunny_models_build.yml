          class JobItem {
            const JobItem({
              required this.client,
              required this.role,
              required this.date,
              required this.location,
              required this.amount,
              required this.rating,
            });

            final String client;
            final String role;
            final String date;
            final String location;
            final double amount;
            final int rating;
          }

          String money(double value) {
            final fixed = value
                .toStringAsFixed(2)
                .replaceAll('.', ',');

            final parts = fixed.split(',');

            final chars =
                parts[0].split('').reversed.toList();

            final out = <String>[];

            for (var i = 0;
                i < chars.length;
                i++) {
              if (i > 0 && i % 3 == 0) {
                out.add('.');
              }

              out.add(chars[i]);
            }

            final integer =
                out.reversed.join();

            return 'R\$ $integer,${parts[1]}';
          }
