          class MainShell extends StatefulWidget {
            const MainShell({
              super.key,
              required this.jobs,
              required this.onAddJob,
              required this.onUpdateJob,
              required this.onDeleteJob,
              required this.onLogout,
            });

            final List<Job> jobs;
            final void Function(Job) onAddJob;
            final void Function(Job) onUpdateJob;
            final void Function(String) onDeleteJob;
            final Future<void> Function() onLogout;

            @override
            State<MainShell> createState() =>
                _MainShellState();
          }

          class _MainShellState
              extends State<MainShell> {
            int tab = 0;

            void openNewJob() {
              Navigator.of(context).push(
                MaterialPageRoute(
                  fullscreenDialog: true,
                  builder: (_) => NewJobPage(
                    onSave: (job) {
                      widget.onAddJob(job);
                    },
                  ),
                ),
              );
            }

            void openJob(Job job) {
              Navigator.of(context).push(
                MaterialPageRoute(
                  builder: (_) => JobDetailPage(
                    job: job,
                    onUpdate:
                        widget.onUpdateJob,
                    onDelete:
                        widget.onDeleteJob,
                  ),
                ),
              );
            }

            @override
            Widget build(BuildContext context) {
              final pages = [
                HomePage(
                  jobs: widget.jobs,
                  onNewJob: openNewJob,
                  onJob: openJob,
                  goJobs: () {
                    setState(() {
                      tab = 1;
                    });
                  },
                  goFinance: () {
                    setState(() {
                      tab = 2;
                    });
                  },
                ),
                JobsPage(
                  jobs: widget.jobs,
                  onNewJob: openNewJob,
                  onJob: openJob,
                ),
                FinancePage(
                  jobs: widget.jobs,
                ),
                ProfilePage(
                  onLogout: widget.onLogout,
                ),
              ];

              return Scaffold(
                body: AnimatedSwitcher(
                  duration:
                      const Duration(milliseconds: 220),
                  child: KeyedSubtree(
                    key: ValueKey(tab),
                    child: pages[tab],
                  ),
                ),
                bottomNavigationBar:
                    BunnyBottomNavigation(
                  index: tab,
                  onChanged: (value) {
                    setState(() {
                      tab = value;
                    });
                  },
                ),
              );
            }
          }

          class HomePage extends StatelessWidget {
            const HomePage({
              super.key,
              required this.jobs,
              required this.onNewJob,
              required this.onJob,
              required this.goJobs,
              required this.goFinance,
