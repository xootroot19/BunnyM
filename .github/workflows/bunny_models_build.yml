          class Job {
            Job({
              required this.id,
              required this.client,
              required this.type,
              required this.locationType,
              required this.address,
              required this.date,
              required this.fee,
              required this.paid,
              required this.expenses,
            });

            final String id;
            final String client;
            final String type;
            final String locationType;
            final String address;
            final String date;
            final double fee;
            final bool paid;
            final List<Expense> expenses;

            double get expenseTotal =>
                expenses.fold<double>(
                  0,
                  (sum, item) =>
                      sum + item.value,
                );

            double get total =>
                fee + expenseTotal;

            Job copyWith({
              bool? paid,
            }) {
              return Job(
                id: id,
                client: client,
                type: type,
                locationType:
                    locationType,
                address: address,
                date: date,
                fee: fee,
                paid: paid ?? this.paid,
                expenses:
                    List.from(expenses),
              );
            }

            Map<String, dynamic> toJson() {
              return {
                'id': id,
                'client': client,
                'type': type,
                'locationType':
                    locationType,
                'address': address,
                'date': date,
                'fee': fee,
                'paid': paid,
                'expenses': expenses
                    .map(
                      (e) =>
                          e.toJson(),
                    )
                    .toList(),
              };
            }

            factory Job.fromJson(
              Map<String, dynamic> json,
            ) {
              return Job(
                id: json['id'] ?? '',
                client:
                    json['client'] ?? '',
                type:
                    json['type'] ?? '',
                locationType:
                    json['locationType'] ??
                        '',
                address:
                    json['address'] ?? '',
                date:
                    json['date'] ?? '',
                fee:
                    (json['fee'] ?? 0)
                        .toDouble(),
                paid:
                    json['paid'] ?? false,
                expenses:
                    ((json['expenses'] ??
                                []) as List)
                            .map(
                              (e) =>
                                  Expense.fromJson(
                                Map<String,
                                        dynamic>.from(
                                    e),
                              ),
                            )
                            .toList(),
              );
            }
          }

          class Expense {
            Expense({
              required this.id,
              required this.type,
              required this.value,
            });

            final String id;
            final String type;
            final double value;

            Map<String, dynamic> toJson() {
              return {
                'id': id,
                'type': type,
                'value': value,
              };
            }

            factory Expense.fromJson(
              Map<String, dynamic> json,
            ) {
              return Expense(
                id: json['id'] ?? '',
                type:
                    json['type'] ?? '',
                value:
                    (json['value'] ?? 0)
                        .toDouble(),
              );
            }
          }

          String money(double value) {
            final parts =
                value.toStringAsFixed(2).split('.');

            var integer = parts[0];

            final buffer =
                StringBuffer();

            for (var i = 0;
                i < integer.length;
                i++) {
              final remaining =
                  integer.length - i;

              buffer.write(integer[i]);

              if (remaining > 1 &&
                  remaining % 3 == 1) {
                buffer.write('.');
              }
            }

            return 'R\$ ${buffer.toString()},${parts[1]}';
          }

          double parseMoney(String value) {
            if (value.trim().isEmpty) {
              return 0;
            }

            var normalized =
                value
                    .replaceAll(
                      'R\$',
                      '',
                    )
                    .replaceAll(
                      ' ',
                      '',
                    )
                    .replaceAll(
                      RegExp(
                        r'[^0-9,\.]',
                      ),
                      '',
                    );

            if (normalized
                .contains(',')) {
              normalized = normalized
                  .replaceAll('.', '')
                  .replaceAll(',', '.');
            }

            return double.tryParse(
                  normalized,
                ) ??
                0;
          }

          IconData expenseIcon(
            String type,
          ) {
            if (type.contains(
              'Uber',
            )) {
              return Icons
                  .directions_car_outlined;
            }

            if (type ==
                'Hospedagem') {
              return Icons
                  .hotel_outlined;
            }

            if (type ==
                'Alimentação') {
              return Icons
                  .restaurant_outlined;
            }

            if (type ==
                'Produção') {
              return Icons
                  .auto_awesome_outlined;
            }

            if (type ==
                'Estacionamento') {
              return Icons
                  .local_parking_outlined;
            }

            if (type ==
                'Pedágio') {
              return Icons
                  .toll_outlined;
            }

            return Icons
                .receipt_long_outlined;
          }

