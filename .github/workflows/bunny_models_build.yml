          class NewJobPage extends StatefulWidget {
            const NewJobPage({
              super.key,
              required this.onSave,
            });

            final void Function(Job) onSave;

            @override
            State<NewJobPage> createState() =>
                _NewJobPageState();
          }

          class _NewJobPageState
              extends State<NewJobPage> {
            int step = 1;

            final client =
                TextEditingController();
            final address =
                TextEditingController();
            final date =
                TextEditingController();
            final fee =
                TextEditingController();

            String type = 'Ensaio';
            String location =
                'Estúdio';

            final expenses =
                <Expense>[];

            @override
            void dispose() {
              client.dispose();
              address.dispose();
              date.dispose();
              fee.dispose();
              super.dispose();
            }

            double get feeValue =>
                parseMoney(fee.text);

            double get expenseTotal =>
                expenses.fold<double>(
                  0,
                  (s, e) => s + e.value,
                );

            void next() {
              if (step == 1 &&
                  client.text.trim().isEmpty) {
                showMessage(
                  context,
                  'Informe o cliente ou contratante.',
                );
                return;
              }

              if (step == 2 &&
                  feeValue <= 0) {
                showMessage(
                  context,
                  'Informe o valor do cachê.',
                );
                return;
              }

              if (step < 3) {
                setState(() {
                  step++;
                });
                return;
              }

              final job = Job(
                id: DateTime.now()
                    .microsecondsSinceEpoch
                    .toString(),
                client:
                    client.text.trim(),
                type: type,
                locationType:
                    location,
                address:
                    address.text.trim(),
                date: date.text.trim().isEmpty
                    ? 'Data a definir'
                    : date.text.trim(),
                fee: feeValue,
                paid: false,
                expenses:
                    List.from(expenses),
              );

              widget.onSave(job);

              Navigator.pop(context);

              showMessage(
                context,
                'Job salvo com sucesso.',
              );
            }

            Future<void>
                addExpense() async {
              final result =
                  await showModalBottomSheet<
                      Expense>(
                context: context,
                isScrollControlled: true,
                backgroundColor:
                    Colors.transparent,
                builder: (_) =>
                    const AddExpenseSheet(),
              );

              if (result != null) {
                setState(() {
                  expenses.add(result);
                });
              }
            }

            @override
            Widget build(BuildContext context) {
              return Scaffold(
                backgroundColor:
                    BunnyColors.background,
                appBar: AppBar(
                  backgroundColor:
                      BunnyColors.background,
                  surfaceTintColor:
                      Colors.transparent,
                  title: Column(
                    children: [
                      const Text(
                        'Novo job',
                        style: TextStyle(
                          color:
                              BunnyColors.text,
                          fontWeight:
                              FontWeight.w900,
                          fontSize: 15,
                        ),
                      ),
                      Text(
                        'Etapa $step de 3',
                        style:
                            const TextStyle(
                          color:
                              BunnyColors.muted,
                          fontSize: 9,
                        ),
                      ),
                    ],
                  ),
                  centerTitle: true,
                ),
                body: Column(
                  children: [
                    LinearProgressIndicator(
                      minHeight: 4,
                      value: step / 3,
                      backgroundColor:
                          BunnyColors.pinkSoft,
                      color:
                          BunnyColors.pink,
                    ),
                    Expanded(
                      child:
                          AnimatedSwitcher(
                        duration:
                            const Duration(
                          milliseconds: 280,
                        ),
                        transitionBuilder:
                            (child,
                                animation) {
                          return FadeTransition(
                            opacity:
                                animation,
                            child:
                                SlideTransition(
                              position:
                                  Tween<
                                      Offset>(
                                begin:
                                    const Offset(
                                  .05,
                                  0,
                                ),
                                end:
                                    Offset.zero,
                              ).animate(
                                animation,
                              ),
                              child: child,
                            ),
                          );
                        },
                        child:
                            SingleChildScrollView(
                          key:
                              ValueKey(step),
                          padding:
                              const EdgeInsets
                                  .fromLTRB(
                            20,
                            24,
                            20,
                            120,
                          ),
                          child: step == 1
                              ? buildStep1()
                              : step == 2
                                  ? buildStep2()
                                  : buildStep3(),
                        ),
                      ),
                    ),
                  ],
                ),
                bottomNavigationBar:
                    Container(
                  padding:
                      const EdgeInsets.fromLTRB(
                    14,
                    12,
                    14,
                    20,
                  ),
                  decoration:
                      const BoxDecoration(
                    color: Colors.white,
                    border: Border(
                      top: BorderSide(
                        color:
                            BunnyColors.border,
                      ),
                    ),
                  ),
                  child: Row(
                    children: [
                      if (step > 1) ...[
                        SizedBox(
                          width: 55,
                          height: 55,
                          child:
                              OutlinedButton(
                            style:
                                OutlinedButton
                                    .styleFrom(
                              padding:
                                  EdgeInsets.zero,
                              side:
                                  const BorderSide(
                                color:
